name: Nook
summary: Private, encrypted notes and checklists that sync over Nostr.
description: |
  Nook is a private Android notes and checklist app.

  Your notes are encrypted to your Nostr public key before they are synced to
  relays. Create, edit, pin, search, and delete Markdown notes and checklists;
  Nook continues working offline and syncs when a connection returns.

  Private keys are protected with Android Keystore when you sign in locally.
  Compatible Android signer apps can keep your key outside Nook.
